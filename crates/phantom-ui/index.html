<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>phantom :: console</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0d0b'/%3E%3Cpath d='M4 13V4.5C4 3 5.3 2 8 2s4 1 4 2.5V13l-1.4-1.2L9.3 13 8 11.8 6.7 13l-1.3-1.2z' fill='%235fff87'/%3E%3Crect x='6' y='5' width='1.4' height='2' fill='%230a0d0b'/%3E%3Crect x='8.8' y='5' width='1.4' height='2' fill='%230a0d0b'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#0a0d0b",
              ink2: "#0f1411",
              ink3: "#16201a",
              rule: "#26332b",
              dim: "#6a7c70",
              fg: "#bfcbc3",
              hi: "#eaf6ee",
              ok: "#5fff87",
              bad: "#ff5f5f",
              warn: "#ffaf00",
              info: "#5fd7ff",
              odd: "#ff87ff",
            },
            fontFamily: {
              mono: ["IBM Plex Mono", "ui-monospace", "Menlo", "Consolas", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --ink: #0a0d0b;
        --ink3: #16201a;
        --rule: #26332b;
        --dim: #6a7c70;
        --fg: #bfcbc3;
        --ok: #5fff87;
      }
      html, body { background: var(--ink); color: var(--fg); }
      body { margin: 0; font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 60;
        background: repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(0, 0, 0, 0.22) 3px);
      }
      ::selection { background: var(--ok); color: var(--ink); }
      .glow { text-shadow: 0 0 10px rgba(95, 255, 135, 0.45); }
      .pane { position: relative; border: 1px solid var(--rule); background: var(--ink); }
      .pane-head {
        position: absolute;
        top: -0.75em;
        left: 0.6rem;
        right: 0.6rem;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        line-height: 1.4;
        pointer-events: none;
        white-space: nowrap;
      }
      .pane-head > * { background: var(--ink); padding: 0 0.35rem; pointer-events: auto; overflow: hidden; text-overflow: ellipsis; }
      .row { cursor: pointer; }
      .row:hover { background: var(--ink3); }
      .row.sel { background: var(--ok); }
      .row.sel, .row.sel * { color: var(--ink) !important; text-shadow: none !important; }
      .btn { cursor: pointer; white-space: nowrap; }
      .btn:hover:not(:disabled), .btn:hover:not(:disabled) * { background: var(--fg); color: var(--ink) !important; }
      .btn:disabled { opacity: 0.35; cursor: not-allowed; }
      .row.sel .btn:hover, .row.sel .btn:hover * { background: var(--ink); color: var(--ok) !important; }
      .key { display: inline-block; min-width: 1.3em; padding: 0 0.25em; text-align: center; color: var(--ink); background: var(--dim); }
      .blink { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
      input { caret-color: var(--ok); }
      input::placeholder { color: var(--dim); opacity: 0.7; }
      * { scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
      *::-webkit-scrollbar { width: 7px; height: 7px; }
      *::-webkit-scrollbar-thumb { background: var(--rule); }
      *::-webkit-scrollbar-track { background: transparent; }
    </style>
    <link data-trunk rel="rust" data-bin="phantom-ui" data-wasm-opt="z" />
  </head>
  <body class="bg-ink font-mono text-fg"></body>
</html>
