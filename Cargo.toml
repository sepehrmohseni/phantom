[workspace]
resolver = "2"
members = [
    "crates/phantom-core",
    "crates/phantom-engine",
    "crates/phantom-ui",
    "crates/phantom-cli",
]
default-members = [
    "crates/phantom-core",
    "crates/phantom-engine",
    "crates/phantom-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Sepehr Mohseni"]
repository = "https://github.com/sepehrmohseni/phantom"
homepage = "https://sepehrmohseni.github.io/phantom"
keywords = ["traffic-replay", "shadowing", "mocking", "proxy", "testing"]
categories = ["development-tools::testing", "network-programming", "web-programming::http-server"]

[workspace.dependencies]
phantom-core = { path = "crates/phantom-core", version = "0.1.0", default-features = false }
phantom-engine = { path = "crates/phantom-engine", version = "0.1.0" }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
parking_lot = "0.12"
dashmap = "6"

axum = { version = "0.7", features = ["ws", "macros"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

redb = "2.1"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
uuid = { version = "1", features = ["v4", "v7", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"

leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.5", features = ["http", "websocket"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Element", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "EventTarget", "ScrollIntoViewOptions", "ScrollLogicalPosition"] }

clap = { version = "4.5", features = ["derive", "env"] }
rust-embed = "8"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release.package.phantom-ui]
opt-level = "z"
